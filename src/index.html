<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narrative Organizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <input id="project-title" class="project-title" spellcheck="false" aria-label="Narrative title">
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab" data-view="list" title="List view (Ctrl+1)">☰ List</button>
      <button class="tab" data-view="timeline" title="Timeline view (Ctrl+2)">⟿ Timeline</button>
      <button class="tab" data-view="board" title="Free-form board (Ctrl+3)">▦ Board</button>
      <button class="tab" data-view="read" title="Read as one story (Ctrl+4)">❡ Read</button>
    </nav>

    <div class="top-actions">
      <button id="btn-new" class="btn primary" title="New idea (Ctrl+N)">+ New idea</button>
      <button id="btn-undo" class="btn icon" title="Undo (Ctrl+Z)">↶</button>
      <button id="btn-redo" class="btn icon" title="Redo (Ctrl+Y)">↷</button>
      <div class="menu-wrap">
        <button id="btn-menu" class="btn icon" title="File">⋯</button>
        <div id="file-menu" class="dropdown hidden">
          <button data-action="new-project">New narrative…</button>
          <button data-action="open">Open…</button>
          <button data-action="save-as">Save as…</button>
          <hr>
          <button data-action="export-txt">Export story (.txt)</button>
          <button data-action="export-rtf">Export story for WordPad (.rtf)</button>
          <button data-action="export-md">Export story (.md)</button>
          <hr>
          <button data-action="theme">Toggle dark mode</button>
          <button data-action="help">Keyboard shortcuts</button>
        </div>
      </div>
      <span id="save-status" class="save-status">Saved</span>
    </div>
  </header>

  <main id="view"></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
